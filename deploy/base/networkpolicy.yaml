# The enrollment sync's egress, under the namespace's default-deny: DNS (the
# house policy, openshift-dns on 5353) and outbound https — to github.com and
# api.github.com for the roster clone and login translation, and to the control
# plane's API Route for the reconciliation itself. The pod initiates everything
# and listens on nothing, so ingress stays denied.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: enrollment-sync
spec:
  podSelector:
    matchLabels:
      app: enrollment-sync
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - port: 5353
          protocol: UDP
        - port: 5353
          protocol: TCP
    - ports:
        - port: 443
          protocol: TCP
